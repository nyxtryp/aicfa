name: AICFA VDS Control

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  control:
    if: github.event.issue.pull_request == null && github.event.comment.author_association == 'OWNER' && github.event.comment.body != '/aicfa tests'
    runs-on: self-hosted
    steps:
      - name: Run allowed command and report result
        env:
          COMMAND: ${{ github.event.comment.body }}
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          set +e
          cd /srv/frostdeploy/aicfa/current
          export PYTHONPATH="$PWD/src${PYTHONPATH:+:$PYTHONPATH}"
          OUTPUT=$(mktemp)
          trap 'rm -f "$OUTPUT"' EXIT

          case "$COMMAND" in
            "/aicfa status")
              {
                echo "=== release ==="
                readlink -f /srv/frostdeploy/aicfa/current
                echo "=== files ==="
                ls -la | head -30
                echo "=== service ==="
                systemctl --no-pager --full status fd-aicfa || true
              } >"$OUTPUT" 2>&1
              ;;
            "/aicfa features")
              .venv/bin/pytest -q tests/test_features.py >"$OUTPUT" 2>&1
              ;;
            "/aicfa rotation")
              {
                echo "=== production market rotation ==="
                timeout --signal=TERM --kill-after=10s 900s taskset -c 1 nice -n 10 .venv/bin/python scripts/run_market_rotation.py --market-timeout 60
                ROTATION_RC=$?
                echo "=== service after rotation ==="
                systemctl is-active fd-aicfa
                echo "rotation_exit_code: $ROTATION_RC"
                test "$ROTATION_RC" -eq 0
              } >"$OUTPUT" 2>&1
              ;;
            "/aicfa pipeline")
              {
                echo "=== production pipeline: BTC/USDT ==="
                timeout --signal=TERM --kill-after=10s 120s taskset -c 1 nice -n 10 .venv/bin/python scripts/diagnose_market_pipeline.py --assets BTC/USDT
                PIPE_RC=$?
                echo "=== service after pipeline ==="
                systemctl is-active fd-aicfa
                echo "pipeline_exit_code: $PIPE_RC"
                test "$PIPE_RC" -eq 0
              } >"$OUTPUT" 2>&1
              ;;
            "/aicfa inspect-grt")
              {
                echo "=== GRT journal/setup registry ==="
                echo "--- journal matches ---"
                grep -i 'GRT/USDT' /srv/frostdeploy/aicfa/shared/data/journal/events.jsonl | tail -30 || true
                echo "--- registry GRT ---"
                python3 - <<'PY'
import json
from pathlib import Path
p=Path("/srv/frostdeploy/aicfa/shared/data/journal/setup_registry.json")
if p.exists():
    data=json.loads(p.read_text())
    for key, value in data.get("setups", {}).items():
        if "GRT/USDT" in key:
            print(json.dumps({"key":key,"status":value.get("status"),"lifecycle_status":value.get("lifecycle_status"),"created_at_ms":value.get("created_at_ms"),"last_seen_at_ms":value.get("last_seen_at_ms"),"last_checked_at_ms":value.get("last_checked_at_ms"),"setup":value.get("setup")}, ensure_ascii=False))
else:
    print("registry missing")
PY
                echo "--- recent GRT-related lines from service log ---"
                journalctl -u fd-aicfa --since "2 hours ago" --no-pager | grep -i 'GRT' | tail -80 || true
              } >"$OUTPUT" 2>&1
              ;;
            "/aicfa git")
              {
                echo "Git metadata is managed by FrostDeploy."
                readlink -f /srv/frostdeploy/aicfa/current
              } >"$OUTPUT" 2>&1
              ;;
            "/aicfa deploy-diagnose")
              {
                echo "=== current ==="
                readlink -f /srv/frostdeploy/aicfa/current
                echo "=== releases ==="
                ls -lt --time-style=long-iso /srv/frostdeploy/aicfa/releases | head -20
                echo "=== deploy-related processes ==="
                ps -eo pid,ppid,user,lstart,cmd --sort=-start_time | grep -Ei 'frostdeploy|freim|deploy' | grep -v grep | head -80
                echo "=== deploy-related services ==="
                systemctl list-units --all --type=service --no-pager | grep -Ei 'frost|freim|deploy' || true
                echo "=== deploy commands ==="
                for x in frostdeploy freimctl freim frostctl fdctl; do
                  command -v "$x" 2>/dev/null && "$x" --version 2>/dev/null | head -3
                done
                echo "=== project metadata ==="
                ls -la /srv/frostdeploy/aicfa
                stat /srv/frostdeploy/aicfa/current /srv/frostdeploy/aicfa/.freim-deploy 2>/dev/null || true
              } >"$OUTPUT" 2>&1
              ;;
            *)
              echo "Unknown command. Allowed: /aicfa status, /aicfa tests, /aicfa features, /aicfa git, /aicfa inspect-grt, /aicfa deploy-diagnose" >"$OUTPUT"
              ;;
          esac

          RC=$?
          echo "=== AICFA VDS CONTROL ===" >>"$OUTPUT"
          echo "command: $COMMAND" >>"$OUTPUT"
          echo "exit_code: $RC" >>"$OUTPUT"

          python3 - "$OUTPUT" "$REPO" "$ISSUE_NUMBER" "$GH_TOKEN" <<'PY'
          import json, sys, urllib.request
          path, repo, issue, token = sys.argv[1:]
          with open(path, encoding="utf-8", errors="replace") as f:
              output = f.read()
          if len(output) > 6000:
              output = output[-6000:]
          body = chr(96)*3 + "text\n" + output.replace(chr(96)*3, "'''") + "\n" + chr(96)*3
          req = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/issues/{issue}/comments",
              data=json.dumps({"body": body}).encode(),
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
              },
              method="POST",
          )
          with urllib.request.urlopen(req, timeout=20) as resp:
              resp.read()
          PY

          exit $RC

  tests:
    if: github.event.issue.pull_request == null && github.event.comment.author_association == 'OWNER' && github.event.comment.body == '/aicfa tests'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout AICFA
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install test dependencies
        run: python -m pip install -r requirements.txt

      - name: Run isolated AICFA tests on GitHub-hosted runner
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          set +e
          OUTPUT=$(mktemp)
          trap 'rm -f "$OUTPUT"' EXIT

          {
            echo "=== AICFA TEST SUITE: GITHUB-HOSTED RUNNER ==="
            echo "Tests run on GitHub infrastructure, not the AICFA VDS."
            echo "One pytest process at a time; 1 CPU core; 120s timeout per file."
            echo
            TOTAL_RC=0
            for TEST_FILE in tests/test_*.py; do
              echo "=== START $TEST_FILE ==="
              timeout --signal=TERM --kill-after=10s 120s taskset -c 0 nice -n 10 pytest -q "$TEST_FILE"
              FILE_RC=$?
              echo "=== END $TEST_FILE exit_code=$FILE_RC ==="
              if [ "$FILE_RC" -ne 0 ]; then
                echo "STOP: $TEST_FILE failed or timed out."
                TOTAL_RC=$FILE_RC
                break
              fi
              echo
            done
            exit "$TOTAL_RC"
          } 2>&1 | tee "$OUTPUT"
          TEST_PIPE_RC=${PIPESTATUS[0]}

          echo "=== AICFA GITHUB TEST RESULT ===" >>"$OUTPUT"
          echo "exit_code: $TEST_PIPE_RC" >>"$OUTPUT"

          python - "$OUTPUT" "$REPO" "$ISSUE_NUMBER" "$GH_TOKEN" <<'PY'
          import json, sys, urllib.request
          path, repo, issue, token = sys.argv[1:]
          with open(path, encoding="utf-8", errors="replace") as f:
              output = f.read()
          if len(output) > 6000:
              output = output[-6000:]
          body = "### AICFA tests — GitHub-hosted runner\n\n" + chr(96)*3 + "text\n" + output.replace(chr(96)*3, "'''") + "\n" + chr(96)*3
          req = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/issues/{issue}/comments",
              data=json.dumps({"body": body}).encode(),
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
              },
              method="POST",
          )
          with urllib.request.urlopen(req, timeout=20) as resp:
              resp.read()
          PY

          exit "$TEST_PIPE_RC"
