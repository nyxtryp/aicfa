name: AICFA VDS Control

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  control:
    if: github.event.issue.pull_request == null && github.event.comment.author_association == 'OWNER'
    runs-on: self-hosted
    steps:
      - name: Run allowed command and report result
        env:
          COMMAND: ${{ github.event.comment.body }}
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          set +e
          cd /srv/frostdeploy/aicfa/current
          OUTPUT=$(mktemp)
          trap 'rm -f "$OUTPUT"' EXIT

          case "$COMMAND" in
            "/aicfa status")
              {
                echo "=== release ==="
                readlink -f /srv/frostdeploy/aicfa/current
                echo "=== files ==="
                ls -la | head -30
                echo "=== service ==="
                systemctl --no-pager --full status fd-aicfa || true
              } >"$OUTPUT" 2>&1
              ;;
            "/aicfa tests")
              .venv/bin/pytest -q >"$OUTPUT" 2>&1
              ;;
            "/aicfa features")
              .venv/bin/pytest -q tests/test_features.py >"$OUTPUT" 2>&1
              ;;
            "/aicfa git")
              {
                echo "Git metadata is managed by FrostDeploy."
                readlink -f /srv/frostdeploy/aicfa/current
              } >"$OUTPUT" 2>&1
              ;;
            *)
              echo "Unknown command. Allowed: /aicfa status, /aicfa tests, /aicfa features, /aicfa git" >"$OUTPUT"
              ;;
          esac

          RC=$?
          echo "=== AICFA VDS CONTROL ===" >>"$OUTPUT"
          echo "command: $COMMAND" >>"$OUTPUT"
          echo "exit_code: $RC" >>"$OUTPUT"

          python3 - "$OUTPUT" "$REPO" "$ISSUE_NUMBER" "$GH_TOKEN" <<'PY'
          import json, sys, urllib.request
          path, repo, issue, token = sys.argv[1:]
          with open(path, encoding="utf-8", errors="replace") as f:
              output = f.read()
          if len(output) > 6000:
              output = output[-6000:]
          body = chr(96)*3 + "text\\n" + output.replace(chr(96)*3, "'''") + "\\n" + chr(96)*3
          req = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/issues/{issue}/comments",
              data=json.dumps({"body": body}).encode(),
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
              },
              method="POST",
          )
          with urllib.request.urlopen(req, timeout=20) as resp:
              resp.read()
          PY

          exit $RC
