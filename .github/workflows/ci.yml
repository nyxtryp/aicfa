name: AICFA CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: aicfa-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Regression partition ${{ matrix.partition }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        partition: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Run pytest partition
        shell: bash
        run: |
          set -euo pipefail
          files="$(PARTITION=${{ matrix.partition }} python -c 'import os,pathlib; ps=sorted(pathlib.Path("tests").glob("test_*.py")); p=int(os.environ["PARTITION"]); print(" ".join(str(x) for i,x in enumerate(ps) if i % 8 == p))')"
          test -n "$files"
          python -m pytest -q --tb=short $files

  syntax:
    name: Syntax checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m compileall -q src main.py web
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check web/app.js
