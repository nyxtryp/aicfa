name: AICFA CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: aicfa-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m pytest tests/test_features.py -q -x --tb=short
      - run: python -m compileall -q src main.py web
      - run: node --check web/app.js
